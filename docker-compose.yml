services:
  qdrant:
    container_name: rag-qdrant
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
    volumes:
      - ./data/qdrant:/qdrant/storage
  ollama:
    container_name: rag-ollama
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
